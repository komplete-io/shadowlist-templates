# The yarn workspace root is the repo root.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: yarn eslint --no-warn-ignored --max-warnings 0 {staged_files}
    - name: format
      glob: '*.{js,cjs,mjs,ts,tsx,json,md,yml,yaml}'
      run: node_modules/.bin/prettier --check --config .prettierrc --ignore-path .gitignore --ignore-path .prettierignore {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: yarn typecheck
