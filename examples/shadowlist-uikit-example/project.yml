# Generate with ./generate.sh, which sets SHADOWLIST_ROOT to ../../../shadowlist when it is unset
# and passes it on relative to this folder.
# The kit and the core come from that engine checkout, the templates from this repository.
name: ShadowListKitExample
include:
  - path: ruler.yml
    enable: ${SHADOWRULER_ENABLED}
options:
  bundleIdPrefix: shadowlist
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: false
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ShadowListKit:
    type: framework.static
    platform: iOS
    sources:
      - path: ${SHADOWLIST_ROOT}/packages/shadowlist-uikit/Sources/ShadowListKit/include/ShadowListKit
        headerVisibility: public
      - path: ${SHADOWLIST_ROOT}/packages/shadowlist-uikit/Sources/ShadowListKit/Internal
        headerVisibility: project
      - path: ${SHADOWLIST_ROOT}/packages/shadowlist-uikit/Sources/ShadowListKit
        includes: ['*.mm']
      - path: ${SHADOWLIST_ROOT}/packages/shadowlist-core
        includes: ['*.cpp', 'host/*.cpp']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shadowlist.kit
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS: ['$(SRCROOT)/${SHADOWLIST_ROOT}/packages']
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: YES
  ShadowListUtilsCore:
    type: framework.static
    platform: iOS
    sources:
      - path: ../../packages/shadowlist-uikit-utils/Sources/ShadowListUtilsCore/include/ShadowListUtilsCore
        headerVisibility: public
      - path: ../../packages/shadowlist-uikit-utils/Sources/ShadowListUtilsCore
        includes: ['*.mm']
      - path: ../../packages/shadowlist-utils-core
        includes: ['*.cpp']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shadowlist.utils.core
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS:
          [
            '$(SRCROOT)/../../packages',
            '$(SRCROOT)/${SHADOWLIST_ROOT}/packages',
          ]
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: YES
  EnrichedMarkdownCppShim:
    type: framework.static
    platform: iOS
    sources:
      - path: ../../packages/enriched-markdown-uikit/cpp
        includes: ['*.h']
        headerVisibility: public
      - path: ../../packages/enriched-markdown-uikit/cpp
        includes: ['*.cpp']
      - path: ../../packages/enriched-markdown-core
        includes:
          [
            'enrmrkd/*.c',
            'enrmrkd/*.h',
            'parser/*.cpp',
            'parser/*.hpp',
            'repair/*.cpp',
            'repair/*.hpp',
            'highlight/*.cpp',
            'highlight/*.hpp',
            'latex/*.cpp',
            'latex/*.hpp',
          ]
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shadowlist.enrichedmarkdown.shim
        DEFINES_MODULE: YES
        # The shim has no umbrella header, so Xcode cannot write its module map itself.
        MODULEMAP_FILE: '$(SRCROOT)/EnrichedMarkdownCppShim.modulemap'
        GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'ENRMRKD_USE_UTF8=1']
        HEADER_SEARCH_PATHS:
          [
            '$(SRCROOT)/../../packages/enriched-markdown-core/enrmrkd',
            '$(SRCROOT)/../../packages/enriched-markdown-core/parser',
            '$(SRCROOT)/../../packages/enriched-markdown-core/repair',
            '$(SRCROOT)/../../packages/enriched-markdown-core/highlight',
            '$(SRCROOT)/../../packages/enriched-markdown-core/latex',
          ]
        GENERATE_INFOPLIST_FILE: YES
  EnrichedMarkdown:
    type: framework.static
    platform: iOS
    sources:
      - path: ../../packages/enriched-markdown-uikit/Sources/EnrichedMarkdown
    dependencies:
      - target: EnrichedMarkdownCppShim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shadowlist.enrichedmarkdown
        DEFINES_MODULE: YES
        SWIFT_VERSION: '5.9'
        OTHER_SWIFT_FLAGS: ['$(inherited)', '-package-name', 'EnrichedMarkdown']
        GENERATE_INFOPLIST_FILE: YES
  ShadowListUtils:
    type: framework.static
    platform: iOS
    sources:
      - path: ../../packages/shadowlist-uikit-utils/Sources/ShadowListUtils
    dependencies:
      - target: ShadowListKit
      - target: ShadowListUtilsCore
      - target: EnrichedMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shadowlist.utils
        DEFINES_MODULE: YES
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: YES
  ShadowListKitExample:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ${SHADOWLIST_ROOT}/packages/shadowlist-uikit/Bench/ShadowListKitBench.m
    dependencies:
      - target: ShadowListKit
      - target: ShadowListUtilsCore
      - target: ShadowListUtils
      - target: EnrichedMarkdownCppShim
      - target: EnrichedMarkdown
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SL UIKit
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shadowlist.uikit.example
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS:
          ['$(SRCROOT)/${SHADOWLIST_ROOT}/packages/shadowlist-uikit/Bench']
        OTHER_LDFLAGS: ['-ObjC', '-lc++']
        TARGETED_DEVICE_FAMILY: '1'
